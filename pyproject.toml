[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eds"
version = "0.1.0"
description = "KTÜ TEKNOFEST Elektronik Harp — Elektronik Destek (ED) sistemi: RX omurgası, ölçüm/raporlama, DF temeli"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — KTÜ EH takımı" }
dependencies = [
    "numpy>=1.24",
    "pyzmq>=25",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Rapor grafikleri / "ekran görüntüsü" PNG'leri
report = ["matplotlib>=3.7"]
# Mesaj şeması doğrulaması (geliştirme sırasında açık tutun)
validate = ["jsonschema>=4.18"]
dev = ["pytest>=7.4", "jsonschema>=4.18", "matplotlib>=3.7", "ruff>=0.4"]
# NOT: SoapySDR ve libiio Python bağlamaları pip'ten değil, sistem paketinden gelir:
#   sudo apt install python3-soapysdr python3-libiio   (bkz. scripts/install_ubuntu.sh)

[project.scripts]
eds = "eds.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eds = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "realtime: zamanlamaya duyarlı (gerçek zamanlı sim) testler",
    "hardware: gerçek SDR donanımı gerektirir (CI'da atlanır)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B905"]
